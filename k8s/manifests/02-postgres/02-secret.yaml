# Dev-only credentials for the local learning cluster. In a real deployment
# this file would NOT be committed to git. Secrets would come from a vault
# (Sealed Secrets, External Secrets Operator, SOPS, etc). Here it's plain
# so the whole stack is reproducible with a single `kubectl apply`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cloud-platform
type: Opaque
stringData:
  POSTGRES_USER: cloud_user
  POSTGRES_PASSWORD: a822f9b682825e5e1e4acfcf1ea802ad
  POSTGRES_DB: cloud_platform
