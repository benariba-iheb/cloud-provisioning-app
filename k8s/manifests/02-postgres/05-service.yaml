# Headless (clusterIP: None) - standard for StatefulSets. Gives stable DNS
# (postgres.cloud-platform.svc.cluster.local) that the backend will use
# as its DATABASE_URL host, without needing a virtual/load-balanced IP.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloud-platform
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
