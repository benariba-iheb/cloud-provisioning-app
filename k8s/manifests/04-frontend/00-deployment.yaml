apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # No image registry - images are built locally on the "debian" node
      # and imported straight into containerd there. See the matching note
      # on the backend Deployment.
      nodeSelector:
        kubernetes.io/hostname: debian
      containers:
        - name: frontend
          image: cloud-platform/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
