# Least-privilege, namespace-scoped: the backend provisions and tears down
# ephemeral instance pods and execs into them for the web terminal, and
# never needs to touch anything outside cloud-platform - a Role, not a
# ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-pod-manager
  namespace: cloud-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # "create" is the documented/conventional verb for exec access, but a
    # WebSocket handshake is always an HTTP GET per protocol (RFC 6455) -
    # confirmed live against this cluster (v1.36.2) that its authorizer
    # checks "get" for this subresource, not "create". Granting both so
    # this doesn't silently break again on a client/version that checks
    # the other one.
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    # Per-user instance isolation policies, created on demand in
    # k8sService.js (one per user, idempotent). No update/delete/watch/list -
    # each is only ever created once and left in place.
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-manager-binding
  namespace: cloud-platform
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: cloud-platform
roleRef:
  kind: Role
  name: backend-pod-manager
  apiGroup: rbac.authorization.k8s.io
