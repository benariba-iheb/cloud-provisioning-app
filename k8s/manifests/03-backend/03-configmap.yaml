apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cloud-platform
data:
  NODE_ENV: "production"
  K8S_NAMESPACE: "cloud-platform"
  INSTANCE_TTL_SECONDS: "600"
  JWT_EXPIRES_IN: "30m"
  # This cluster has no Ingress/TLS termination in front of the frontend
  # NodePort - a Secure cookie would be silently dropped by the browser
  # over plain HTTP. Flip to "true" once real TLS is in front of this.
  COOKIE_SECURE: "false"
  # NodePort chosen in 04-frontend/01-service.yaml - keep these in sync.
  FRONTEND_URL: "http://192.168.1.13:30080"
